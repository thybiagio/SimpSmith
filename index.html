<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>SimpSmith</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Press Start 2P", monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #2b1d12, #0f0a07);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .menu {
            width: 700px;
            max-width: 90vw;
            border: 6px solid #c49a6c;
            background: linear-gradient(#3a2a1d, #1a120b);
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 30px;
            gap: 30px;
        }

        .titulo {
            text-align: center;
            color: #f5d7a1;
            font-size: 32px;
            text-shadow: 3px 3px 0 #000;
        }

        .subtitulo {
            text-align: center;
            color: #d8c3a5;
            font-size: 11px;
            line-height: 1.8;
        }

        button {
            width: 220px;
            height: 60px;
            background: #8b5e3c;
            border: 3px solid #f5d7a1;
            color: #fff3d1;
            cursor: pointer;
            font-family: "Press Start 2P", monospace;
            font-size: 12px;
            transition: 0.2s;
        }

        button:hover {
            background: #a06b44;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="menu">
        <div class="titulo">
            🔨 SIMPSMITH 🔨
        </div>

        <div class="subtitulo">
            Reconstrua a oficina do seu antigo mestre<br>
            e torne-se o maior ferreiro do reino.
        </div>

        <button onclick="window.location.href='./game.html'">
            JOGAR
        </button>
    </div>

</body>

</html>
